version: '3.8'

services:
  web-threejs:
    build: .
    container_name: robocar-web-threejs
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - robocar-network

networks:
  robocar-network:
    driver: bridge
