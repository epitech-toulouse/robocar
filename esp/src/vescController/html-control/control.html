<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboCar WiFi Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            gap: 8px;
            display: flex;
            align-items: center;
        }

        .status.disconnected {
            background: #ffebee;
            color: #c62828;
        }

        .status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status.disconnected .status-dot {
            background: #c62828;
            animation: pulse-red 1.5s infinite;
        }

        .status.connected .status-dot {
            background: #2e7d32;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .connection-section {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid #e0e0e0;
        }

        .connection-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .connection-section input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            font-family: monospace;
        }

        .connection-section input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-connect {
            background: #667eea;
            color: white;
        }

        .btn-connect:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-connect:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-disconnect {
            background: #ff6b6b;
            color: white;
        }

        .btn-disconnect:hover:not(:disabled) {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-disconnect:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .controls-section {
            margin-top: 30px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            row-gap: 20px;
            margin-bottom: 30px;
        }

        .control-button {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
            background: #e0e0e0;
            color: #999;
        }

        .control-button:not(:disabled):active {
            transform: scale(0.95);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .control-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .arrow-up { background: #4CAF50; color: white; grid-column: 2; }
        .arrow-down { background: #FF9800; color: white; grid-column: 2; margin-top: 10px; }
        .arrow-left { background: #2196F3; color: white; grid-column: 1; }
        .arrow-right { background: #FF5722; color: white; grid-column: 3; }

        .emergency-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .emergency-btn {
            flex: 1;
            padding: 20px;
            background: #ff3b30;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: none;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
        }

        .emergency-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(255, 59, 48, 0.3);
        }

        .emergency-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .logs {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
            border: 1px solid #ddd;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #eee;
            color: #666;
        }

        .log-entry.error {
            color: #d32f2f;
        }

        .log-entry.success {
            color: #388e3c;
        }

        .log-entry.info {
            color: #1976d2;
        }

        .instructions {
            background: #fffde7;
            border-left: 4px solid #fbc02d;
            padding: 15px;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .instructions strong {
            display: block;
            margin-bottom: 8px;
            color: #f57f17;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .controls-grid {
                gap: 12px;
            }

            .control-button {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 RoboCar WiFi</h1>
            <div class="status disconnected" id="status">
                <span class="status-dot"></span>
                <span id="statusText">Déconnecté</span>
            </div>
        </div>

        <div class="connection-section">
            <label>Adresse IP/Host (Proxy)</label>
            <input type="text" id="ipInput" placeholder="Ex: 192.168.4.1" value="192.168.4.1">
            
            <label>Port Proxy</label>
            <input type="number" id="portInput" placeholder="Ex: 3333" value="3333">
            
            <div class="button-group">
                <button class="btn btn-connect" id="connectBtn" onclick="connectWebSocket()">Connecter</button>
                <button class="btn btn-disconnect" id="disconnectBtn" onclick="disconnectWebSocket()" disabled>Déconnecter</button>
            </div>
        </div>

        <div class="instructions" id="instructions" style="display: none;">
            <strong>📍 Instructions WiFi:</strong>
            1. Connectez-vous au WiFi <strong>ROBOCAR_CTRL</strong> (mdp: <strong>robocar123</strong>)<br>
            2. Puis appuyez sur "Connecter"
        </div>

        <div class="controls-section">
            <div class="emergency-section">
                <button class="emergency-btn" id="emergencyBtn" onclick="sendCommand('S')" disabled>
                    ⚠️ STOP D'URGENCE
                </button>
            </div>

            <div class="controls-grid">
                <button class="control-button arrow-up" id="forwardBtn" disabled>↑ AVANT</button>

                <button class="control-button arrow-left" id="leftBtn" disabled>← GAUCHE</button>

                <button class="control-button arrow-right" id="rightBtn" disabled>DROITE →</button>

                <button class="control-button arrow-down" id="backwardBtn" disabled>↓ ARRIÈRE</button>
            </div>
        </div>

        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 12px; text-transform: uppercase;">Logs</label>
            <div class="logs" id="logs"></div>
        </div>
    </div>

    <script>
        const MAX_LOGS = 20;
        const REQUEST_TIMEOUT_MS = 3500;
        let logs = [];

        function getDefaultBaseUrl() {
            const isHttpPage = window.location.protocol === 'http:';
            if (isHttpPage && window.location.hostname) {
                return `http://${window.location.hostname}${window.location.port ? `:${window.location.port}` : ''}`;
            }
            return null;
        }

        async function httpGetWithTimeout(url) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-store',
                    signal: controller.signal
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return await response.text();
            } catch (error) {
                const raw = (error && (error.message || String(error))) ? (error.message || String(error)) : '';
                const rawLower = raw.toLowerCase();
                const isLikelySafariNetworkFailure =
                    rawLower.includes('load failed') ||
                    rawLower.includes('failed to fetch') ||
                    rawLower.includes('networkerror');

                if (!isLikelySafariNetworkFailure) {
                    throw error;
                }

                // Fallback for iPhone Safari where fetch can fail while direct URL still works.
                return await httpGetWithXhr(url, REQUEST_TIMEOUT_MS);
            } finally {
                clearTimeout(timeout);
            }
        }

        function httpGetWithXhr(url, timeoutMs) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.timeout = timeoutMs;
                xhr.setRequestHeader('Cache-Control', 'no-cache');

                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        resolve(xhr.responseText || '');
                    } else {
                        reject(new Error(`HTTP ${xhr.status}`));
                    }
                };

                xhr.onerror = () => reject(new Error('XHR NetworkError'));
                xhr.ontimeout = () => reject(new Error('XHR timeout'));
                xhr.send();
            });
        }

        function describeNetworkError(error) {
            const raw = (error && (error.message || String(error))) ? (error.message || String(error)) : 'Erreur inconnue';
            const rawLower = raw.toLowerCase();

            if (rawLower.includes('aborted')) {
                return 'Timeout reseau: verifie que le telephone est bien connecte au WiFi ROBOCAR_CTRL';
            }

            if (
                rawLower.includes('failed to fetch') ||
                rawLower.includes('networkerror') ||
                rawLower.includes('load failed')
            ) {
                if (window.location.protocol === 'https:') {
                    return 'Safari bloque HTTP depuis une page HTTPS. Ouvre la page en HTTP local (pas en HTTPS).';
                }
                return 'Reseau inaccessible. Sur iPhone: rester sur le WiFi ROBOCAR_CTRL et desactiver temporairement Donnees cellulaires/Wi-Fi Assist.';
            }

            return raw;
        }

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('fr-FR');
            logs.push({ timestamp, message, type });
            if (logs.length > MAX_LOGS) logs.shift();
            renderLogs();
        }

        function renderLogs() {
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML = logs.map(log => 
                `<div class="log-entry ${log.type}">[${log.timestamp}] ${log.message}</div>`
            ).join('');
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const controllers = document.querySelectorAll('.control-button, .emergency-btn');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');

            if (connected) {
                status.className = 'status connected';
                statusText.textContent = '🟢 Connecté';
                controllers.forEach(btn => btn.disabled = false);
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                document.getElementById('instructions').style.display = 'none';
            } else {
                status.className = 'status disconnected';
                statusText.textContent = '🔴 Déconnecté';
                controllers.forEach(btn => btn.disabled = true);
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        async function connectWebSocket() {
            const ip = document.getElementById('ipInput').value;
            const port = document.getElementById('portInput').value;

            if (!ip || !port) {
                addLog('Erreur: IP et Port requis', 'error');
                return;
            }

            try {
                const baseUrl = `http://${ip}:${port}`;
                addLog(`Tentative de connexion a ${baseUrl}...`, 'info');

                await httpGetWithTimeout(`${baseUrl}/status`);
                addLog('Connecte au RoboCar', 'success');
                updateStatus(true);
                window.carControlUrl = baseUrl;
            } catch (error) {
                addLog(`Erreur de connexion: ${describeNetworkError(error)}`, 'error');
                updateStatus(false);
            }
        }

        function disconnectWebSocket() {
            window.carControlUrl = null;
            updateStatus(false);
            addLog('Déconnecté', 'info');
        }

        async function sendCommand(cmd) {
            if (!window.carControlUrl) {
                addLog('Erreur: Non connecté', 'error');
                return;
            }

            try {
                await httpGetWithTimeout(`${window.carControlUrl}/cmd?c=${cmd}`);
                addLog(`Envoye: ${cmd}`, 'success');
            } catch (error) {
                addLog(`Erreur d'envoi: ${describeNetworkError(error)}`, 'error');
            }
        }

        function startCommand(cmd) {
            sendCommand(cmd);
        }

        function endCommand(cmd) {
            sendCommand(cmd);
        }

        function bindDirectionalButton(id, pressCmd, releaseCmd) {
            const btn = document.getElementById(id);
            if (!btn) return;

            let pressed = false;

            const press = (e) => {
                e.preventDefault();
                if (pressed) return;
                pressed = true;
                startCommand(pressCmd);
            };

            const release = (e) => {
                e.preventDefault();
                if (!pressed) return;
                pressed = false;
                endCommand(releaseCmd);
            };

            btn.addEventListener('pointerdown', (e) => {
                press(e);
            });

            btn.addEventListener('pointerup', (e) => {
                release(e);
            });

            btn.addEventListener('pointercancel', (e) => {
                release(e);
            });

            btn.addEventListener('lostpointercapture', (e) => {
                release(e);
            });

            // iOS Safari fallback when Pointer Events behave inconsistently.
            btn.addEventListener('touchstart', (e) => {
                press(e);
            }, { passive: false });

            btn.addEventListener('touchend', (e) => {
                release(e);
            }, { passive: false });

            btn.addEventListener('touchcancel', (e) => {
                release(e);
            }, { passive: false });

            btn.addEventListener('mousedown', (e) => {
                press(e);
            });

            btn.addEventListener('mouseup', (e) => {
                release(e);
            });

            btn.addEventListener('mouseleave', (e) => {
                release(e);
            });
        }

        // Prevenir le scroll par defaut
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.control-button, .emergency-btn')) {
                e.preventDefault();
            }
        }, { passive: false });

        // Initialize
        const pageDefaultUrl = getDefaultBaseUrl();
        if (pageDefaultUrl) {
            const parsed = new URL(pageDefaultUrl);
            document.getElementById('ipInput').value = parsed.hostname;
            document.getElementById('portInput').value = parsed.port || '3333';
        }

        bindDirectionalButton('forwardBtn', 'F', 'f');
        bindDirectionalButton('leftBtn', 'L', 'l');
        bindDirectionalButton('rightBtn', 'R', 'r');
        bindDirectionalButton('backwardBtn', 'B', 'b');

        updateStatus(false);
        addLog('RoboCar Control Interface prête', 'success');
        if (window.location.protocol === 'https:') {
            addLog('Attention: page HTTPS detectee. Safari iPhone peut bloquer les appels HTTP vers l\'ESP32.', 'error');
        }
        document.getElementById('instructions').style.display = 'block';
    </script>
</body>
</html>
