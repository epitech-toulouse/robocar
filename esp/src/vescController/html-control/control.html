<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboCar WiFi Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            gap: 8px;
            display: flex;
            align-items: center;
        }

        .status.disconnected {
            background: #ffebee;
            color: #c62828;
        }

        .status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status.disconnected .status-dot {
            background: #c62828;
            animation: pulse-red 1.5s infinite;
        }

        .status.connected .status-dot {
            background: #2e7d32;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .connection-section {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid #e0e0e0;
        }

        .connection-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .connection-section input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            font-family: monospace;
        }

        .connection-section input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-connect {
            background: #667eea;
            color: white;
        }

        .btn-connect:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-connect:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-disconnect {
            background: #ff6b6b;
            color: white;
        }

        .btn-disconnect:hover:not(:disabled) {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-disconnect:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .controls-section {
            margin-top: 30px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            row-gap: 20px;
            margin-bottom: 30px;
        }

        .control-button {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            background: #e0e0e0;
            color: #999;
        }

        .control-button:not(:disabled):active {
            transform: scale(0.95);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .control-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .arrow-up { background: #4CAF50; color: white; grid-column: 2; }
        .arrow-down { background: #FF9800; color: white; grid-column: 2; margin-top: 10px; }
        .arrow-left { background: #2196F3; color: white; grid-column: 1; }
        .arrow-right { background: #FF5722; color: white; grid-column: 3; }

        .emergency-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .emergency-btn {
            flex: 1;
            padding: 20px;
            background: #ff3b30;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
        }

        .emergency-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(255, 59, 48, 0.3);
        }

        .emergency-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .logs {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
            border: 1px solid #ddd;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #eee;
            color: #666;
        }

        .log-entry.error {
            color: #d32f2f;
        }

        .log-entry.success {
            color: #388e3c;
        }

        .log-entry.info {
            color: #1976d2;
        }

        .instructions {
            background: #fffde7;
            border-left: 4px solid #fbc02d;
            padding: 15px;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .instructions strong {
            display: block;
            margin-bottom: 8px;
            color: #f57f17;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .controls-grid {
                gap: 12px;
            }

            .control-button {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 RoboCar WiFi</h1>
            <div class="status disconnected" id="status">
                <span class="status-dot"></span>
                <span id="statusText">Déconnecté</span>
            </div>
        </div>

        <div class="connection-section">
            <label>Adresse IP/Host (Proxy)</label>
            <input type="text" id="ipInput" placeholder="Ex: 192.168.4.1" value="192.168.4.1">
            
            <label>Port Proxy</label>
            <input type="number" id="portInput" placeholder="Ex: 3333" value="3333">
            
            <div class="button-group">
                <button class="btn btn-connect" id="connectBtn" onclick="connectWebSocket()">Connecter</button>
                <button class="btn btn-disconnect" id="disconnectBtn" onclick="disconnectWebSocket()" disabled>Déconnecter</button>
            </div>
        </div>

        <div class="instructions" id="instructions" style="display: none;">
            <strong>📍 Instructions WiFi:</strong>
            1. Connectez-vous au WiFi <strong>ROBOCAR_CTRL</strong> (mdp: <strong>robocar123</strong>)<br>
            2. Puis appuyez sur "Connecter"
        </div>

        <div class="controls-section">
            <div class="emergency-section">
                <button class="emergency-btn" id="emergencyBtn" onclick="sendCommand('S')" disabled>
                    ⚠️ STOP D'URGENCE
                </button>
            </div>

            <div class="controls-grid">
                <button class="control-button arrow-up" id="forwardBtn" 
                    onmousedown="startCommand('F')" 
                    ontouchstart="startCommand('F')" 
                    onmouseup="endCommand('f')" 
                    ontouchend="endCommand('f')" 
                    onmouseleave="endCommand('f')" 
                    disabled>↑ AVANT</button>

                <button class="control-button arrow-left" id="leftBtn" 
                    onmousedown="startCommand('L')" 
                    ontouchstart="startCommand('L')" 
                    onmouseup="endCommand('l')" 
                    ontouchend="endCommand('l')" 
                    onmouseleave="endCommand('l')" 
                    disabled>← GAUCHE</button>

                <button class="control-button arrow-right" id="rightBtn" 
                    onmousedown="startCommand('R')" 
                    ontouchstart="startCommand('R')" 
                    onmouseup="endCommand('r')" 
                    ontouchend="endCommand('r')" 
                    onmouseleave="endCommand('r')" 
                    disabled>DROITE →</button>

                <button class="control-button arrow-down" id="backwardBtn" 
                    onmousedown="startCommand('B')" 
                    ontouchstart="startCommand('B')" 
                    onmouseup="endCommand('b')" 
                    ontouchend="endCommand('b')" 
                    onmouseleave="endCommand('b')" 
                    disabled>↓ ARRIÈRE</button>
            </div>
        </div>

        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 12px; text-transform: uppercase;">Logs</label>
            <div class="logs" id="logs"></div>
        </div>
    </div>

    <script>
        const MAX_LOGS = 20;
        let logs = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('fr-FR');
            logs.push({ timestamp, message, type });
            if (logs.length > MAX_LOGS) logs.shift();
            renderLogs();
        }

        function renderLogs() {
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML = logs.map(log => 
                `<div class="log-entry ${log.type}">[${log.timestamp}] ${log.message}</div>`
            ).join('');
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const controllers = document.querySelectorAll('.control-button, .emergency-btn');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');

            if (connected) {
                status.className = 'status connected';
                statusText.textContent = '🟢 Connecté';
                controllers.forEach(btn => btn.disabled = false);
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                document.getElementById('instructions').style.display = 'none';
            } else {
                status.className = 'status disconnected';
                statusText.textContent = '🔴 Déconnecté';
                controllers.forEach(btn => btn.disabled = true);
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        function connectWebSocket() {
            const ip = document.getElementById('ipInput').value;
            const port = document.getElementById('portInput').value;

            if (!ip || !port) {
                addLog('Erreur: IP et Port requis', 'error');
                return;
            }

            try {
                const baseUrl = `http://${ip}:${port}`;
                addLog(`Tentative de connexion à ${baseUrl}...`, 'info');
                
                // Test de connexion avec un simple GET /status
                fetch(`${baseUrl}/status`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(data => {
                        addLog('✓ Connecté au RoboCar', 'success');
                        updateStatus(true);
                        // Stocker l'URL pour les commandes
                        window.carControlUrl = baseUrl;
                    })
                    .catch(error => {
                        addLog(`Erreur de connexion: ${error}`, 'error');
                        updateStatus(false);
                    });
            } catch (error) {
                addLog(`Erreur: ${error.message}`, 'error');
                updateStatus(false);
            }
        }

        function disconnectWebSocket() {
            window.carControlUrl = null;
            updateStatus(false);
            addLog('Déconnecté', 'info');
        }

        function sendCommand(cmd) {
            if (!window.carControlUrl) {
                addLog('Erreur: Non connecté', 'error');
                return;
            }

            try {
                fetch(`${window.carControlUrl}/cmd?c=${cmd}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(data => {
                        addLog(`Envoyé: ${cmd}`, 'success');
                    })
                    .catch(error => {
                        addLog(`Erreur d'envoi: ${error.message}`, 'error');
                    });
            } catch (error) {
                addLog(`Erreur d'envoi: ${error.message}`, 'error');
            }
        }

        function startCommand(cmd) {
            sendCommand(cmd);
        }

        function endCommand(cmd) {
            sendCommand(cmd);
        }

        // Prévenir le scroll par défaut
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.control-button, .emergency-btn')) {
                e.preventDefault();
            }
        }, { passive: false });

        // Initialize
        updateStatus(false);
        addLog('RoboCar Control Interface prête', 'success');
        document.getElementById('instructions').style.display = 'block';
    </script>
</body>
</html>
